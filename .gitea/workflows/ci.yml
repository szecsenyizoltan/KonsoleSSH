name: CI

# Every push and pull request: JVM unit tests and the SSH integration tests
# against real sshd instances (with coverage), Android lint, detekt, and a
# CVE scan of the locked dependencies. The runner does not enforce
# timeout-minutes, so the long steps run under timeout(1) themselves.
#
# The instrumented emulator tests run in their own job, and only where the
# runner gives the job container a usable /dev/kvm; elsewhere the job warns
# and skips them. Locally: ./gradlew :app:connectedDebugAndroidTest

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (licences; AGP downloads the platform and build tools)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The SSH integration tests start their own sshd instances. Without
      # systemd nothing creates sshd's privilege separation directory, and
      # sshd refuses to start without it.
      - name: OpenSSH server
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO apt-get install -y -q openssh-server
          $SUDO mkdir -p /run/sshd
          $SUDO chmod 0755 /run/sshd

      - name: Unit and integration tests, with coverage
        env:
          KONSOLE_REQUIRE_SSHD: '1'
        run: timeout 30m ./gradlew --no-daemon :app:createDebugUnitTestCoverageReport

      - name: Coverage summary
        run: python3 tools/coverage-summary.py

      - name: Android lint
        run: timeout 20m ./gradlew --no-daemon :app:lintDebug

      - name: detekt
        run: timeout 15m ./gradlew --no-daemon detekt

      # The dependencies that ship in the APK must have no known
      # vulnerability. Build tools (lint) and test libraries are scanned too,
      # but only reported: they never reach a device.
      - name: OSV-Scanner
        run: |
          curl -sSfL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          mkdir -p build/osv
          grep -E '^#|releaseRuntimeClasspath' app/gradle.lockfile > build/osv/gradle.lockfile
          echo "::group::Release runtime (must be clean)"
          /tmp/osv-scanner scan source --lockfile build/osv/gradle.lockfile
          echo "::endgroup::"
          echo "::group::All configurations (report only)"
          /tmp/osv-scanner scan source --lockfile app/gradle.lockfile || true
          echo "::endgroup::"

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: KVM
        id: kvm
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No usable /dev/kvm on this runner; the instrumented tests are skipped."
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.kvm.outputs.usable == 'true'
        uses: actions/checkout@v4

      - name: JDK 17
        if: steps.kvm.outputs.usable == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        if: steps.kvm.outputs.usable == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instrumented tests on an emulator
        if: steps.kvm.outputs.usable == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: timeout 40m ./gradlew --no-daemon :app:connectedDebugAndroidTest
