name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The SSH integration tests start their own sshd instances.
      - name: Install OpenSSH server
        run: sudo apt-get update -q && sudo apt-get install -y -q openssh-server

      - name: Unit and integration tests, with coverage
        env:
          KONSOLE_REQUIRE_SSHD: '1'
        run: ./gradlew :app:createDebugUnitTestCoverageReport --no-daemon

      - name: Coverage summary
        run: |
          echo "### JVM test line coverage" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/coverage/test/debug/
          if-no-files-found: ignore

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: detekt (Kotlin static analysis)
        run: ./gradlew detekt --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
