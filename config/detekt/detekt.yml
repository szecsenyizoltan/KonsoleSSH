# Project-specific detekt configuration. It builds upon the default config,
# so only the differences are listed here.

complexity:
  LongMethod:
    active: true
    threshold: 80        # looser for UI code (default 60)
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    active: false        # Android components carry many callbacks
  CyclomaticComplexMethod:
    active: true
    threshold: 25        # the ANSI state machine and handleCSI
  LargeClass:
    active: true
    threshold: 900       # TerminalBuffer (parser and screen together) is still this large

style:
  MagicNumber:
    active: false        # port numbers, colour palettes, SGR codes, timeouts
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']   # Compose previews are used by the IDE, not by code

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'  # allows test names in backticks

performance:
  SpreadOperator:
    active: false        # for the byteArrayOf(27) + "...".toByteArray() pattern

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: "^(_|ignored|expected)$"

exceptions:
  TooGenericExceptionCaught:
    active: false        # JSch throws many specific exceptions; lifecycle calls catch broadly around I/O
  SwallowedException:
    active: false

# potential-bugs: the default rules stay active.

# ── ktlint rules (detekt-formatting plugin) ──
formatting:
  active: true
  android: true
  autoCorrect: false
  MaximumLineLength:
    active: false        # detekt's MaxLineLength covers it
  NoWildcardImports:
    active: true
  Indentation:
    active: true
  TrailingCommaOnCallSite:
    active: false        # a style choice, not enforced here
  TrailingCommaOnDeclarationSite:
    active: false
