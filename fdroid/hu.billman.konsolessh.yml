AutoName: KonsoleSSH
Summary: Multi-tab SSH terminal inspired by KDE Konsole

Description: |-
    Multi-tab SSH terminal for Android with a Canvas-based emulator,
    jump-host support, SFTP file upload, and encrypted storage for
    saved connection profiles.

    Features:

    * Multi-tab UI with independent SSH sessions per tab (ViewPager2).
    * SSH authentication with password or PEM private key (optional
      passphrase), keyboard-interactive auth supported.
    * Jump hosts (``ssh -J``), including multi-hop chains, with local
      port forwarding for reaching hosts on internal networks (for
      example a VM behind a hypervisor). The connection test, key
      upload and SFTP go through the same chain.
    * Ed25519, ECDSA and RSA host keys; curve25519 and ECDH key
      exchange (Bouncy Castle).
    * Built-in key generator: an RSA-3072 key pair is generated on the
      device and the public key can be uploaded with the password.
    * Canvas-based terminal emulator: 256-colour + truecolor, bold,
      underline, reverse video, scrollback, ANSI/VT100 +
      xterm-256color PTY, alt-screen buffer for vi/top/less/mc, DEC
      line drawing, wide characters (CJK, emoji) and cursor position
      reports. Output is parsed off the main thread.
    * Bundled NerdFont (JetBrainsMono) with proper emoji / surrogate
      pair rendering.
    * On-screen key bar with Fn row, Ctrl combos, sticky modifiers,
      arrow row, SFTP upload.
    * A foreground service keeps the process alive while a session is
      connected; sessions, prompts and output survive rotation and
      screen lock.
    * Interactive password prompts when no password is saved.
    * Saved connections encrypted with AES-256-GCM using a
      non-exportable Android Keystore key.
    * Server host key verification (trust on first use): the SHA256
      fingerprint is confirmed once, then checked on every connection;
      a changed key is rejected by default. Jump-chain targets are
      checked under their real names.
    * Tree-grouped connection picker based on common underscore
      prefixes.
    * Linux command and tmux cheat sheets (swipe from welcome page),
      localised to Hungarian when the system language is Hungarian.
    * Friendly error messages instead of raw JSch exceptions.
    * Edge-to-edge layout with proper window-insets handling.

    No data is collected, shared or uploaded. Credentials stay on
    the device in the encrypted keystore-backed store. After a freeze
    or crash the app only offers to share a problem report (version,
    device, stack trace, no secrets); nothing is sent automatically.

